name: SeasonApp
options:
  bundleIdPrefix: com.season-app
  deploymentTarget:
    iOS: "16.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
packages:
  Turbo:
    url: https://github.com/hotwired/turbo-ios
    from: 8.0.0
targets:
  SeasonApp:
    type: application
    platform: iOS
    sources:
      - SeasonApp
    dependencies:
      - package: Turbo
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.season-app.ios
      INFOPLIST_FILE: SeasonApp/Info.plist
      SWIFT_VERSION: "5.9"
    preBuildScripts:
      - name: "XcodeGen Build"
        script: |
          if which xcodegen >/dev/null; then
            xcodegen generate
          fi
