name: SeasonApp
options:
  bundleIdPrefix: com.season-app
  deploymentTarget:
    iOS: "17.2"
packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    from: 1.2.0
targets:
  SeasonApp:
    type: application
    platform: iOS
    sources:
      - path: SeasonApp
        excludes:
          - "Season Test"
    dependencies:
      - package: HotwireNative
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.season-app.ios
      INFOPLIST_FILE: SeasonApp/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "59"
      CODE_SIGN_ENTITLEMENTS: SeasonApp/SeasonApp.entitlements
      DEVELOPMENT_TEAM: CH4G9T6ZHP
