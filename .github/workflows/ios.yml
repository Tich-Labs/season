name: iOS Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/SeasonApp
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project ios/SeasonApp/SeasonApp.xcodeproj

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project ios/SeasonApp/SeasonApp.xcodeproj \
            -scheme SeasonApp \
            -archivePath SeasonApp.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          echo "${{ secrets.APPSTORE_KEY_BASE64 }}" | base64 -d > /tmp/AuthKey.p8
          xcodebuild -exportArchive \
            -archivePath SeasonApp.xcarchive \
            -exportPath . \
            -exportOptionsPlist ios/SeasonApp/ExportOptions.plist \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f SeasonApp.ipa \
            -t ios \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"
