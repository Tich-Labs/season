name: iOS Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_$(ls /Applications/ | grep Xcode | sort -V | tail -1 | sed 's/Xcode_//;s/.app//').app 2>/dev/null || true
          xcodebuild -version

      - name: Resolve SPM dependencies
        working-directory: ios/SeasonApp
        run: xcodebuild -resolvePackageDependencies -project SeasonApp.xcodeproj -scheme SeasonApp -clonedSourcePackagesDirPath ~/Library/Caches/com.apple.dt.Xcode/SourcePackages

      - name: List schemes
        run: xcodebuild -list -project ios/SeasonApp/SeasonApp.xcodeproj

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/SeasonApp/SeasonApp.xcodeproj \
            -scheme SeasonApp \
            -archivePath SeasonApp.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Import certificate and provisioning profile
        env:
          DIST_CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 -c "import base64,os;f=open('/tmp/dist.p12','wb');f.write(base64.b64decode(os.environ['DIST_CERT_BASE64'].strip()))"
          python3 -c "import base64,os;f=open('/tmp/dist.mobileprovision','wb');f.write(base64.b64decode(os.environ['PROVISIONING_PROFILE_BASE64'].strip()))"
          security create-keychain -p temp123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp123 build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A -f pkcs12 2>/dev/null || \
            security import /tmp/dist.p12 -P "$DIST_CERT_PASSWORD" -A -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k temp123 build.keychain 2>/dev/null || true
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i /tmp/dist.mobileprovision))
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/dist.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "Provisioning profile UUID: $PROFILE_UUID"

      - name: Sign and export IPA
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | head -1 | awk '{print $2}')
          echo "Signing identity: $IDENTITY"
          APP_PATH=SeasonApp.xcarchive/Products/Applications/SeasonApp.app
          PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          cp "$PROFILE" "$APP_PATH/embedded.mobileprovision"
          security cms -D -i "$PROFILE" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/profile.plist > /tmp/entitlements.plist
          /usr/bin/codesign --force --sign "$IDENTITY" --entitlements /tmp/entitlements.plist --timestamp=none "$APP_PATH" 2>&1
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r SeasonApp.ipa Payload/
          rm -rf Payload
          echo "IPA created: SeasonApp.ipa"

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_BASE64: ${{ secrets.APPSTORE_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          python3 -c "import base64,os;f=open(os.path.expanduser('~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8'),'wb');f.write(base64.b64decode(os.environ['APPSTORE_KEY_BASE64'].strip()))"
          xcrun altool --upload-app \
            -f SeasonApp.ipa \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
