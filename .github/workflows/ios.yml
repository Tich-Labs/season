name: iOS Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/SeasonApp
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project ios/SeasonApp/SeasonApp.xcodeproj

      - name: Archive
        run: |
          python3 -c "import base64,os;f=open('/tmp/AuthKey.p8','wb');f.write(base64.b64decode(os.environ['APPSTORE_KEY_BASE64'].strip()))"
          xcodebuild archive \
            -project ios/SeasonApp/SeasonApp.xcodeproj \
            -scheme SeasonApp \
            -archivePath SeasonApp.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -allowProvisioningUpdates
        env:
          APPSTORE_KEY_BASE64: ${{ secrets.APPSTORE_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Export IPA
        env:
          APPSTORE_KEY_BASE64: ${{ secrets.APPSTORE_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          python3 -c "import base64,os;f=open('/tmp/AuthKey.p8','wb');f.write(base64.b64decode(os.environ['APPSTORE_KEY_BASE64'].strip()))"
          xcodebuild -exportArchive \
            -archivePath SeasonApp.xcarchive \
            -exportPath . \
            -exportOptionsPlist ios/SeasonApp/ExportOptions.plist \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f SeasonApp.ipa \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
