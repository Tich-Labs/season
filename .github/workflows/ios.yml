name: iOS Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/SeasonApp
        run: |
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project SeasonApp.xcodeproj -scheme SeasonApp

      - name: List schemes
        run: xcodebuild -list -project ios/SeasonApp/SeasonApp.xcodeproj

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/SeasonApp/SeasonApp.xcodeproj \
            -scheme SeasonApp \
            -archivePath SeasonApp.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Install Signing Certificate
        env:
          DIST_CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          python3 -c "import base64,os;f=open('/tmp/dist.p12','wb');f.write(base64.b64decode(os.environ['DIST_CERT_BASE64'].strip()))"
          openssl pkcs12 -in /tmp/dist.p12 -passin "pass:${DIST_CERT_PASSWORD}" -clcerts -nokeys -out /tmp/dist_cert.pem
          openssl pkcs12 -in /tmp/dist.p12 -passin "pass:${DIST_CERT_PASSWORD}" -nocerts -nodes -out /tmp/dist_key.pem
          security create-keychain -p temp123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp123 build.keychain
          security import /tmp/dist_cert.pem -k build.keychain -A
          security import /tmp/dist_key.pem -k build.keychain -A
          security set-key-partition-list -S apple-tool:,apple: -k temp123 build.keychain 2>/dev/null || true
          security find-identity -v -p codesigning build.keychain
          rm /tmp/dist.p12

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath SeasonApp.xcarchive \
            -exportPath . \
            -exportOptionsPlist ios/SeasonApp/ExportOptions.plist \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}"

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f SeasonApp.ipa \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
