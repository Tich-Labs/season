#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  data_retention:
    class: DataRetentionJob
    schedule: at 2am every day
  cleanup_expired_invites:
    class: CleanupExpiredInvitesJob
    schedule: at 3am every day
  weekly_feedback_nudges:
    class: SendWeeklyFeedbackNudgesJob
    schedule: at 10am every day
  send_morning_reminders:
    class: SendMorningRemindersJob
    schedule: at 9am every day
  send_period_reminders:
    class: SendPeriodRemindersJob
    schedule: at 8am every day
  send_birth_control_reminders:
    class: SendBirthControlRemindersJob
    schedule: at 9pm every day
