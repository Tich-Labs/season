  date:
    # Sunday-first, matching JS Date#getDay() — used to build the
    # appointment date/time picker's weekday abbreviations locale-aware
    # instead of a hardcoded English array. 3 letters, not 1: a single
    # letter can't tell Sunday from Saturday apart (or Tuesday from
    # Thursday) — see appointment_date_picker_controller.js.
    abbr_day_names:
      - "Sun"
      - "Mon"
      - "Tue"
      - "Wed"
      - "Thu"
      - "Fri"
      - "Sat"
    # Month labels for the onboarding birthday picker (index 0 is nil per
    # Rails convention, so January sits at index 1; callers `.compact`).
    abbr_month_names:
      - ~
      - "Jan"
      - "Feb"
      - "Mar"
      - "Apr"
      - "May"
      - "Jun"
      - "Jul"
      - "Aug"
      - "Sep"
      - "Oct"
      - "Nov"
      - "Dec"
    # Single-letter Mon-Sun initials for calendar weekday headers.
    day_initials:
      - "M"
      - "T"
      - "W"
      - "T"
      - "F"
      - "S"
      - "S"
